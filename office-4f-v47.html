<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4층 사무실 산책 v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --ink:#14181B; --paper:#F1EFEA; --teal:#3E7B87; --amber:#E0A32E;
    --sans:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0c0e10;font-family:var(--sans)}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  #gate{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--paper);
    background:radial-gradient(120% 90% at 50% 25%,#2a3136 0%,#0f1214 72%);transition:opacity .45s ease}
  #gate.hidden{opacity:0;pointer-events:none}
  #gate .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--amber);margin-bottom:18px}
  #gate h1{font-size:clamp(32px,6.5vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
  #gate h1 em{font-style:normal;color:var(--teal)}
  #gate p{margin-top:14px;max-width:36ch;font-size:15px;line-height:1.7;color:#A6ADB2}
  #gate button{margin-top:30px;padding:14px 34px;border:0;border-radius:2px;cursor:pointer;
    background:var(--amber);color:#1A1408;font-family:var(--mono);font-size:13px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;transition:transform .15s,box-shadow .15s}
  #gate button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(224,163,46,.3)}
  #gate button:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  #gate .keys{margin-top:32px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;
    font-family:var(--mono);font-size:11px;color:#79828A;letter-spacing:.08em}
  #gate .keys b{color:var(--paper);font-weight:600}
  #crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    border-radius:50%;background:rgba(255,255,255,.75);z-index:10;pointer-events:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  #room{position:absolute;left:22px;bottom:22px;z-index:12;pointer-events:none;
    background:rgba(14,17,19,.74);backdrop-filter:blur(8px);border-left:2px solid var(--teal);padding:10px 16px}
  #room .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:#7E8890;text-transform:uppercase}
  #room .val{font-size:17px;font-weight:700;color:var(--paper);margin-top:3px}
  #score{position:absolute;right:22px;bottom:22px;z-index:12;pointer-events:none;font-family:var(--mono);
    font-size:11px;letter-spacing:.14em;color:#9AA3AA;background:rgba(14,17,19,.74);
    backdrop-filter:blur(8px);padding:11px 15px}
  #score b{color:var(--amber);font-size:14px}
  #act{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:15;
    background:rgba(14,17,19,.82);backdrop-filter:blur(8px);padding:12px 14px;
    display:flex;flex-direction:column;gap:6px;min-width:220px}
  #act[hidden], #say[hidden]{display:none}
  #act .who{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--amber);margin-bottom:4px}
  #act .opt{display:flex;align-items:center;gap:10px;background:transparent;border:0;
    color:var(--paper);font-family:var(--sans);font-size:14px;padding:5px 4px;cursor:pointer;text-align:left}
  #act .opt:hover{background:rgba(255,255,255,.08)}
  #act .opt b{font-family:var(--mono);font-size:11px;color:#0F1214;background:var(--paper);
    width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:0 0 18px}
  #say{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:16;
    background:var(--paper);color:var(--ink);padding:9px 16px;font-size:14px;font-weight:500;
    box-shadow:0 10px 26px rgba(0,0,0,.3);white-space:nowrap}
  #pop{position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:14;
    width:min(430px,86vw);pointer-events:none;background:rgba(241,239,234,.96);color:var(--ink);
    border-left:3px solid var(--amber);padding:16px 20px 18px;opacity:0;
    transition:opacity .18s,transform .18s;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  #pop.on{opacity:1;transform:translate(-50%,0)}
  #pop .tag{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
  #pop h2{font-size:19px;font-weight:800;margin:5px 0 7px;letter-spacing:-.02em}
  #pop p{font-size:13.5px;line-height:1.65;color:#3D4348}
  @media (prefers-reduced-motion:reduce){#pop,#gate,#gate button{transition:none}}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="crosshair" hidden></div>
  <div id="room" hidden><div class="lbl">현재 위치</div><div class="val" id="roomName">엘리베이터 홀</div></div>
  <div id="score" hidden>발견 <b id="found">0</b> / <span id="total">0</span></div>
  <div id="act" hidden><div class="who" id="actWho"></div>
    <button class="opt" data-a="greet"><b>1</b> 인사하기</button>
    <button class="opt" data-a="five"><b>2</b> 하이파이브</button>
    <button class="opt" data-a="surprise"><b>3</b> 놀래키기</button>
  </div>
  <div id="say" hidden></div>
  <div id="pop"><div class="tag" id="popTag"></div><h2 id="popTitle"></h2><p id="popBody"></p></div>
  <div id="gate">
    <div class="eyebrow">Vibe Coding · Live Demo</div>
    <h1>4층 사무실을<br><em>걸어서</em> 한 바퀴</h1>
    <p>엘리베이터에서 시작합니다. 자동문으로 들어가서 120명이 일하는 층을 돌아보세요.</p>
    <button id="go">들어가기</button>
    <div class="keys">
      <span><b>W A S D</b> 이동</span><span><b>마우스</b> 둘러보기</span>
      <span><b>Shift</b> 뛰기</span><span><b>Esc</b> 마우스 풀기</span>
    </div>
  </div>
</div>

<script>
// 출근길(commute.html)에서 엘리베이터로 넘어온 경우: 4층 도착 화면으로 이어지기
(function(){
  if(new URLSearchParams(location.search).get('from')!=='commute') return;
  var g=document.getElementById('gate'); if(!g) return;
  g.style.background='#000';
  var e=g.querySelector('.eyebrow'), h=g.querySelector('h1'), p=g.querySelector('p'), b=document.getElementById('go');
  if(e) e.textContent='4F · 도착';
  if(h) h.innerHTML='4층 사무실에<br><em>도착</em>했습니다';
  if(p) p.textContent='엘리베이터 문이 열립니다. 내려서 자리까지 걸어가세요.';
  if(b) b.textContent='내리기';
})();
</script>
<script>
(function(){
"use strict";

// ════════════════════════════════════════════════════════════
//  ▼▼▼  자리 · 이름 설정 — 여기만 고치면 됩니다  ▼▼▼
//
//  자리 ID  =  <섹션키>-<열><번호>
//     열   :  W = 서쪽 열,  E = 동쪽 열
//     번호 :  1~5  (복도에서 가까운 쪽부터 안쪽으로)
//     예)  '설비운영-E3'  =  설비운영 파트 동쪽 열 세 번째 자리
//
//  섹션키 목록
//     설비운영                                  (남쪽, 통로 옆)
//     공정1 · 공정2 · 공정3                      (남쪽 가운데)
//     설비기술1 · 설비기술2 · 설비기술3           (남쪽 동쪽 끝, 3은 동쪽 열만)
//     소재1 ~ 소재6                              (북쪽 창가)
// ════════════════════════════════════════════════════════════

// 1) 어느 자리에 사람이 앉아 있는지
//    'all' = 전 좌석 착석 / 'none' = 전 좌석 비움 / 배열 = 그 자리만 착석
const SECTION_FILL = {
  '설비운영':   'all',                  // 공석 표시(E1·E2)만 비고 나머지는 착석
  '공정1':'all', '공정2':'all', '공정3':'all',
  '설비기술1':'all', '설비기술2':'all', '설비기술3':'all',
  '소재1':'none','소재2':'none','소재3':'none',
  '소재4':'none','소재5':'none','소재6':'none'
};

// 1-1) PL(리더) 자리의 기준 섹션 — 이 섹션에서 동쪽으로 8.1m 떨어진 곳에 PL 책상이 놓입니다.
//      섹션 좌석은 그대로 유지됩니다. '' 로 두면 PL 자리 없음.
const PL_SECTION = '공정1';

// 1-2) 아예 없애는 자리 (책상·의자·모니터·사람 전부 삭제)
//      PL 책상 좌우로 가장 가까운 두 자리를 비워 통행을 확보합니다.
const REMOVED_SEATS = ['공정2-E5', '공정3-W5'];

// 2) 이름표 — 자리 순서대로 따옴표 안에 이름만 채우면 됩니다.
//    배열 순서:  W1 W2 W3 W4 W5  |  E1 E2 E3 E4 E5
//    W = 서쪽 열, E = 동쪽 열, 번호는 복도에서 가까운 쪽부터 1
//    비워두면('') 명패가 생기지 않습니다.
//
//    ※ 실제로 자리가 없는 칸은 적어도 무시됩니다:
//       설비운영  → W열 없음 (E1~E5만)
//       공정2     → E5 없음 (PL 왼쪽, 빈 책상만 놓임)
//       공정3     → W5 없음 (PL 오른쪽)
//       설비기술3 → E열 없음 (W1~W5만)

const NAMES = {

  // ══ 설비운영 · 5석 ════════════════════════════
  //    통로 파티션 옆 한 줄. W열은 자리가 없습니다.
  '설비운영': {
    E: ['공석', '박영웅', '구현엽', '가선호', '최명수']   //  1(복도쪽) → 5(남쪽 벽)
  },

  // ══ 공정1 · 10석 ══════════════════════════════
  '공정1': {
    W: ['공석', '임은총', '김동희', '이인범', '박성균'],
    E: ['하승현', '박영욱', '김태윤', '박정현', '이수인']
  },

  // ══ 공정2 · 9석 ═══════════════════════════════
  //    E5 는 자리 없음 (PL 왼쪽, 빈 책상만 놓임)
  '공정2': {
    W: ['고주현', '김민지', '김영지', '신효의', '공석'],
    E: ['곽진', '김예지', '임태영', '원치준 파트장님', '']
  },

  // ══ 공정3 · 9석 ═══════════════════════════════
  //    W5 는 자리 없음 (PL 오른쪽)
  '공정3': {
    W: ['김재욱', '고윤성', '공석', '공석', ''],
    E: ['정성진', '조서현', '이재겸', '장창윤', '설동진']
  },

  // ══ 설비기술1 · 10석 ══════════════════════════
  '설비기술1': {
    W: ['이혜진', '공석', '이예은', '공석', '공석'],
    E: ['안동환', '반서현', '임진섭', '하동훈', '유성헌']
  },

  // ══ 설비기술2 · 10석 ══════════════════════════
  '설비기술2': {
    W: ['김상일', '전승우', '이호율', '정동회', '이현준'],
    E: ['고명재', '정주호', '임태선', '유광선', '이기섭 파트장님']
  },

  // ══ 설비기술3 · 5석 ═══════════════════════════
  //    동쪽 끝 한 줄. E열은 자리가 없습니다.
  '설비기술3': {
    W: ['공석', '박태종', '하석규', '박수빈', '공석']
  }

  // 소재 파트는 전원 공석이라 이름을 넣지 않습니다.
};

// '공석' 이라고 적으면 그 자리는 사람도 명패도 없이 빈 자리가 됩니다.
const VACANT = '공석';

// 여성 캐릭터로 표시할 이름 — 여기에 적으면 긴 머리 모델로 바뀝니다.
const FEMALE = ['김예지', '김민지', '이혜진', '조서현', '이수인', '김영지', '이예은', '신효의'];

// 명패를 앉은 사람 기준 왼쪽(+) / 오른쪽(-) 으로 옮김 (단위 m)
const PLATE_SHIFT = { '이기섭 파트장님': 0.10 };

const PL_NAME = '김광철 PL님';

// 자리 ID로 이름 꺼내기
function nameOf(key, s, i){
  const g = NAMES[key];
  if(!g) return '';
  const col = g[s < 0 ? 'W' : 'E'];
  return (col && col[i]) || '';
}

// ▲▲▲  설정 끝  ▲▲▲

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171B1E);
scene.fog = new THREE.Fog(0x171B1E, 26, 62);
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.08, 220);
const EYE = 1.62;

const C = {
  floor:0xA9A297, corr:0x9B9488, carpet:0x6E7A73, wall:0xE7E3DB, wallIn:0xDBD6CC,
  ceil:0xF2F0EB, deskTop:0xF2F1EC, metal:0x8A9196, dark:0x2E3538,
  teal:0x3E7B87, amber:0xE0A32E, green:0x4F7A42, cab:0xF2F1EC, part:0x7C8A83
};

scene.add(new THREE.HemisphereLight(0xffffff, 0x8b8578, 1.0));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.48); sun.position.set(10,24,-16); scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe3ff, 0.26); fill.position.set(-20,16,14); scene.add(fill);

const colliders = [];
const WALLS = [];        // 이름표 시야 차단용 (벽만)
const BOXG = new THREE.BoxGeometry(1,1,1);
const SPHG = new THREE.SphereGeometry(1,10,8);
const M = {};
function mat(c){ if(!M[c]) M[c]=new THREE.MeshLambertMaterial({color:c}); return M[c]; }
function box(x,y,z,w,h,d,color,collide){
  const m=new THREE.Mesh(BOXG,mat(color)); m.position.set(x,y,z); m.scale.set(w,h,d); scene.add(m);
  if(collide) colliders.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2});
  return m;
}
function slab(x1,z1,x2,z2,color,y){
  box((x1+x2)/2, y||0, (z1+z2)/2, Math.abs(x2-x1), 0.06, Math.abs(z2-z1), color, false);
}
const WH=3.7, WT=0.18;
function wallX(z,xa,xb,color){ const w=Math.abs(xb-xa); if(w<0.02)return;
  box((xa+xb)/2,WH/2,z,w,WH,WT,color||C.wall,true);
  WALLS.push({x1:Math.min(xa,xb),x2:Math.max(xa,xb),z1:z-WT/2,z2:z+WT/2}); }
function wallZ(x,za,zb,color){ const d=Math.abs(zb-za); if(d<0.02)return;
  box(x,WH/2,(za+zb)/2,WT,WH,d,color||C.wall,true);
  WALLS.push({x1:x-WT/2,x2:x+WT/2,z1:Math.min(za,zb),z2:Math.max(za,zb)}); }
function lintel(x,z,w,d){ box(x,2.62,z,w,0.4,d,C.teal,false); }

// ═══ 바닥 / 천장 ══════════════════════════════
slab(-30,-12,21,12, C.floor, -0.03);
slab(-30,-2,21,2,   C.corr,  0.005);
slab(-30,-12,-20,-2, C.carpet, 0.005);
slab(-20,-12,21,-2,  C.carpet, 0.005);
slab(-30,2,-25,12,   0x9E9689, 0.005);
slab(-25,2,-18,12,   C.carpet, 0.005);
slab(-18,2,-14.85,12, C.corr,  0.005);
slab(-14.85,2,21,12, C.carpet, 0.005);
box(-4.5, WH, 0, 51.4, 0.12, 24.4, C.ceil, false);

const lampMat = new THREE.MeshBasicMaterial({color:0xFFFBF0});
const lampG = new THREE.PlaneGeometry(2.2,0.45);
for(let x=-28;x<=20;x+=5.4){ for(let z=-10;z<=10;z+=5.4){
  const p=new THREE.Mesh(lampG,lampMat); p.rotation.x=Math.PI/2; p.position.set(x,WH-0.09,z); scene.add(p);
}}

// ═══ 외벽 ═════════════════════════════════════
const glassMat = new THREE.MeshLambertMaterial({color:0xBFDFEC, transparent:true, opacity:0.55});
function windowBand(x,z,w,d){ const m=new THREE.Mesh(BOXG,new THREE.MeshBasicMaterial({color:0xC2E2EF}));
  m.position.set(x,1.85,z); m.scale.set(w,1.5,d); scene.add(m); }
wallX(-12,-30,21); windowBand(-4.5,-11.88,49,0.06);
wallX(12,-30,21);
wallZ(21,-12,12);
wallZ(-30,-12,-1.6); wallZ(-30,1.6,12);

// ── 자동문 (입구 / 탕비실) ────────────────────
function autoDoor(x,z,gapA,gapB,horiz){
  // horiz=true → 문이 x축을 따라 열림 (벽이 z 고정)
  const w = Math.abs(gapB-gapA), half=w/2, mid=(gapA+gapB)/2;
  const frameC = 0x5A666C;
  if(horiz){
    box(mid, 2.42, z, w+0.3, 0.42, 0.3, frameC, false);            // 상부 프레임
    box(gapA-0.06, 1.1, z, 0.12, 2.2, 0.26, frameC, true);
    box(gapB+0.06, 1.1, z, 0.12, 2.2, 0.26, frameC, true);
    // 열린 상태의 유리 패널 (양옆으로 물러남)
    const p1=new THREE.Mesh(BOXG,glassMat); p1.position.set(gapA+half*0.36,1.1,z); p1.scale.set(half*0.62,2.1,0.06); scene.add(p1);
    const p2=new THREE.Mesh(BOXG,glassMat); p2.position.set(gapB-half*0.36,1.1,z); p2.scale.set(half*0.62,2.1,0.06); scene.add(p2);
    box(mid,2.66,z,0.5,0.12,0.34,C.amber,false);                    // 센서
  } else {
    box(x, 2.42, mid, 0.3, 0.42, w+0.3, frameC, false);
    box(x, 1.1, gapA-0.06, 0.26, 2.2, 0.12, frameC, true);

// 머리 위 이름표 — 배경 없이 글자만
const TEXT_CACHE = {};
function textLabel(text){
  if(TEXT_CACHE[text]) return TEXT_CACHE[text];
  const cv=document.createElement('canvas'); cv.width=384; cv.height=96;
  const g=cv.getContext('2d');
  const F=function(n){ return 'bold '+n+'px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif'; };
  let fs=54; g.font=F(fs);
  while(g.measureText(text).width > 356 && fs > 20){ fs-=2; g.font=F(fs); }
  g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=9; g.lineJoin='round'; g.strokeStyle='rgba(12,15,17,0.85)';
  g.strokeText(text,192,52);
  g.fillStyle='#FFFFFF'; g.fillText(text,192,52);
  const t=new THREE.CanvasTexture(cv);
  const m=new THREE.MeshBasicMaterial({map:t, transparent:true, depthWrite:false});
  TEXT_CACHE[text]=m; return m;
}
function floatLabel(rec, text){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(0.86,0.215), textLabel(text));
  m.visible=false; scene.add(m);
  rec.tag = m;
  FLOATS.push({ mesh:m, rec:rec });
}

// 두 점 사이를 벽이 가리는지 (2D)
function blocked(ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az;
  for(let i=0;i<WALLS.length;i++){
    const w=WALLS[i];
    let t0=0, t1=1, ok=true;
    for(let k=0;k<2;k++){
      const p = k? dz : dx, o = k? az : ax;
      const lo = k? w.z1 : w.x1, hi = k? w.z2 : w.x2;
      if(Math.abs(p) < 1e-6){ if(o<lo||o>hi){ ok=false; break; } continue; }
      let ta=(lo-o)/p, tb=(hi-o)/p;
      if(ta>tb){ const s2=ta; ta=tb; tb=s2; }
      if(ta>t0) t0=ta; if(tb<t1) t1=tb;
      if(t0>t1){ ok=false; break; }
    }
    if(ok) return true;
  }
  return false;
}

// PL(리더) 자리 — W5·E5를 없애고 가로로 긴 책상 하나, 복도를 바라보고 앉음
function plDesk(cx0, z0, dir, key){
  const cx = cx0 + dir*8.10;      // 복도를 보는 기준 오른쪽으로 7m 더 이동
  const dz  = z0 + dir*7.95;                    // 책상 (W5/E5 자리)

  box(cx, DESK_Y, dz, 2.2, 0.06, 0.95, C.deskTop, true);
  box(cx-1.0, DESK_Y/2, dz, 0.07, DESK_Y-0.06, 0.85, C.metal, false);
  box(cx+1.0, DESK_Y/2, dz, 0.07, DESK_Y-0.06, 0.85, C.metal, false);
  // 듀얼모니터 — PL 정면(복도 쪽 모서리)에 스탠드형
  [-0.46, 0.46].forEach(function(ox){
    const mz = dz - dir*0.32;
    box(cx+ox, DESK_Y+0.06, mz, 0.34, 0.04, 0.26, 0x3A4145, false);
    box(cx+ox, DESK_Y+0.22, mz, 0.09, 0.30, 0.07, 0x3A4145, false);

    const f=new THREE.Mesh(monG, screenMat);
    f.position.set(cx+ox, MON_Y, mz + dir*0.045);
    f.rotation.y = dir>0 ? Math.PI : 0;
    scene.add(f);
  });
  // 키보드 + 마우스
  box(cx-0.04, DESK_Y+0.045, dz + dir*0.20, 0.42, 0.025, 0.17, 0x2A2F33, false);
  box(cx+0.40, DESK_Y+0.05,  dz + dir*0.22, 0.11, 0.03, 0.07, 0x33383C, false);
  // 캐비넷 — PL 기준 오른쪽에 1개만
  (function(){
    const ox = dir*1.55;
    box(cx+ox, 0.70, dz, 0.5, 1.4, 0.9, C.cab, true);
    box(cx+ox, 1.41, dz, 0.52, 0.04, 0.92, C.cab, false);
    box(cx+ox-dir*0.26, 0.95, dz, 0.03, 0.1, 0.16, C.metal, false);
  })();
  // 명패 + 의자 + PL
  const nm = PL_NAME;
  if(nm){
    box(cx-0.72, DESK_Y+0.04, dz + dir*0.30, 0.46, 0.03, 0.1, 0x8A9196, false);
    const pl=new THREE.Mesh(PLATE_G, nameplate(nm));
    pl.position.set(cx-0.72, DESK_Y+0.12, dz + dir*0.315);
    pl.rotation.y = dir>0 ? Math.PI : 0;
    scene.add(pl);

  // ㄷ자 파티션 — 왼쪽 / 앞 / 오른쪽, 책상+캐비넷 바깥을 감싸고 모니터 절반 높이까지
  (function(){
    const H  = MON_Y;                 // 상단 = 모니터 중앙 (모니터 절반을 가림)
    const T  = 0.08;                  // 두께
    const lx = cx - dir*1.14;         // 왼쪽 면
    const rx = cx + dir*1.84;         // 오른쪽 면 (캐비넷 바깥)
    const fz = dz - dir*0.515;        // 앞 면

    const LZ = 1.03 + 1.00;            // 왼쪽 면만 1m 연장 (PL 뒤쪽으로)
    const lz = dz + dir*0.50;
    box(lx, H/2, lz, T, H, LZ, C.part, true);                        // 왼쪽
    box(lx, H,   lz, T+0.05, 0.05, LZ+0.04, 0x5D6A64, false);
    box(rx, H/2, dz, T, H, 1.03, C.part, true);                      // 오른쪽
    box(rx, H,   dz, T+0.05, 0.05, 1.07, 0x5D6A64, false);
  })();
  chairOffice(cx, z0 + dir*9.00, face);
  person(cx, z0 + dir*8.90, face);
  // 화이트보드 — PL 기준 오른쪽 뒤편
  const wx = cx + dir*1.65, wz = z0 + dir*9.55;
  box(wx, 1.55, wz, 1.9, 1.25, 0.07, 0xF7F6F2, true);
  box(wx, 0.92, wz, 1.9, 0.07, 0.09, 0xB9C0C4, false);
  box(wx-0.85, 0.46, wz, 0.06, 0.92, 0.06, C.metal, false);
  box(wx+0.85, 0.46, wz, 0.06, 0.92, 0.06, C.metal, false);
}

function sectionUnit(cx, z0, dir, key, cols){
  const C2 = cols || [-1, 1];
  const isPL = (key === PL_SECTION);
  SEAT_OFF.forEach((o,i)=>{
    const z = z0 + dir*o;
    C2.forEach(s=>{
      const id  = (s<0 ? 'W' : 'E') + (i+1);
      if(REMOVED_SEATS.indexOf(key + '-' + id) !== -1) return;   // 삭제된 자리
      const nm  = nameOf(key, s, i);
      const vac = (nm === VACANT);                               // '공석' → 사람·명패 없음
      seat(cx, z, s, isFilled(key,id) && !vac, vac ? '' : nm, vac);
    });
  });
  CAB_OFF.forEach((o,i)=>{
    const z=z0+dir*o;
    C2.forEach(s=>{
      // 삭제된 자리 바로 옆의 캐비넷도 같이 제거
      const col = (s<0 ? 'W' : 'E');
      const gone5 = REMOVED_SEATS.indexOf(key + '-' + col + '5') !== -1;
      const gone4 = REMOVED_SEATS.indexOf(key + '-' + col + '4') !== -1;
      if(i === 3 && gone5) return;              // 5번 자리 바깥쪽 캐비넷
      if(i === 2 && gone5 && gone4) return;
      cabinet(cx,z,s);

function pathLen(pts, sx, sz){
  let L=0, px=sx, pz=sz;
  for(let i=0;i<pts.length;i++){ L+=Math.hypot(pts[i][0]-px, pts[i][1]-pz); px=pts[i][0]; pz=pts[i][1]; }
  return L;
}
function setStanding(rec, on){
  rec.legsSit.visible = !on;
  rec.legsWalk.visible = on;
  rec.up.position.y = on ? 0.86 : 0.70;
  rec.baseArm = on ? -0.05 : -0.95;
  rec.armL.rotation.x = rec.baseArm; rec.armR.rotation.x = rec.baseArm;
  rec.hipL.rotation.x = 0; rec.hipR.rotation.x = 0;
  rec.standing = on;
}
function startTrip(rec){
  const sx=rec.seatX, sz=rec.seatZ, ax=rec.aisleX;
  // 가까운 목적지 3곳 중 하나를 고름 (왕복 30초 안에 들어오도록)
  const pause = 2 + Math.random()*3;
  const budget = TRIP_BUDGET - pause - 1.5;        // 걷는 데 쓸 수 있는 시간
  let cand = DESTS.map(function(d){
    const out=[[ax,sz],[ax,0.6]].concat(d.path);
    return { d:d, out:out, L:pathLen(out,sx,sz)*2 };
  }).sort(function(a,b){ return a.L-b.L; });
  const fit = cand.filter(function(c){ return c.L / 2.0 <= budget; });   // 30초 안에 못 돌아오면 제외
  cand = (fit.length ? fit : [cand[0]]).slice(0,4);
  const pick = cand[Math.floor(Math.random()*cand.length)];
  const speed = Math.max(1.0, Math.min(2.0, pick.L / budget));
  const out = pick.out;
  const back = out.slice(0, out.length-1).reverse().concat([[sx,sz]]);
  rec.wander = { state:'out', pts:out, back:back, i:0, speed:speed, pause:pause, t:0, dest:pick.d.n };
  setStanding(rec, true);
  WALKERS.push(rec);
}
function endTrip(rec){
  rec.g.position.set(rec.seatX, 0, rec.seatZ);
  rec.g.rotation.y = rec.seatRot;
  rec.rotY = rec.seatRot;
  setStanding(rec, false);
  rec.head.rotation.x = 0; rec.nod = 0; rec.halt = 0;
  if(rec.tag) rec.tag.visible = false;
  rec.wander = null;
  const k = WALKERS.indexOf(rec); if(k!==-1) WALKERS.splice(k,1);
}
function stepWander(rec, dt){
  const w = rec.wander;
  if(rec.anim) return;                       // 1/2/3 모션 중에는 멈춤
  // 서로 마주봤을 때만 걸으면서 목례
  const gx = rec.g.position.x, gz = rec.g.position.z;
  const dpx = pos.x-gx, dpz = pos.z-gz;
  const dp = Math.hypot(dpx,dpz);
  if(dp > 3.2) w.greeted = false;
  if(dp < 2.0 && !w.greeted && dp > 0.05){
    const nx=dpx/dp, nz=dpz/dp;
    const fwd = Math.sin(rec.g.rotation.y)*nx + Math.cos(rec.g.rotation.y)*nz;   // 상대가 나를 보는가
    const mine = (-Math.sin(yaw))*(-nx) + (-Math.cos(yaw))*(-nz);               // 내가 상대를 보는가
    if(fwd > 0.5 && mine > 0.5){ w.greeted = true; rec.nod = NOD_T; rec.halt = 0.30; }
  }
  if(rec.nod > 0){                            // 고개 까딱 (0.3초는 멈춘 채로)
    rec.nod -= dt;
    const q = 1 - Math.max(rec.nod,0)/NOD_T;
    rec.head.rotation.x = Math.sin(q*Math.PI)*0.40;
    if(rec.nod <= 0) rec.head.rotation.x = 0;
  }
  if(rec.halt > 0){                           // 멈춰 서서 목례하는 동안
    rec.halt -= dt;
    rec.hipL.rotation.x = 0; rec.hipR.rotation.x = 0;
    rec.armL.rotation.x = rec.baseArm; rec.armR.rotation.x = rec.baseArm;
    rec.up.position.y = 0.86;
    return;
  }

  if(w.state === 'pause'){
    w.t -= dt;
    if(w.t <= 0){ w.state='back'; w.pts=w.back; w.i=0; }
    return;
  }
  const tgt = w.pts[w.i];
  if(!tgt){
    if(w.state === 'out'){ w.state='pause'; w.t=w.pause; }
    else endTrip(rec);
    return;
  }
  const dx = tgt[0]-rec.g.position.x, dz = tgt[1]-rec.g.position.z;
  const d = Math.hypot(dx,dz);
  if(d < 0.12){ w.i++; return; }
  const step = Math.min(w.speed*dt, d);
  rec.g.position.x += dx/d*step;
  rec.g.position.z += dz/d*step;
  const want = Math.atan2(dx, dz);
  rec.g.rotation.y += angDiff(rec.g.rotation.y, want) * Math.min(1, dt*7);
  rec.rotY = rec.g.rotation.y;
  // 걷기 모션 — 다리 교차 + 팔 흔들기 + 상하 흔들림
  rec.phase += dt * w.speed * 3.4;
  const sw = Math.sin(rec.phase);
  rec.hipL.rotation.x =  sw*0.52;
  rec.hipR.rotation.x = -sw*0.52;
  rec.armL.rotation.x = rec.baseArm - sw*0.42;
  rec.armR.rotation.x = rec.baseArm + sw*0.42;
  rec.up.position.y = 0.86 + Math.abs(Math.cos(rec.phase))*0.018;
}
const NEAR_DIST = 1.0;   // 이 거리 안으로 들어가면 메뉴가 뜸 (m)
function angDiff(a,b){ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
el.actEl   = document.getElementById('act');
el.actWho  = document.getElementById('actWho');
el.say     = document.getElementById('say');
let nearPerson = null, sayTimer = 0;

function playAct(rec, type){
  if(!rec || !ACTS[type]) return;
  if(rec.anim) return;
  rec.anim = type; rec.t = 0;
  // 플레이어가 있는 방향을 향해 돌아섬
  rec.faceY = Math.atan2(pos.x - rec.g.position.x, pos.z - rec.g.position.z);
  rec.turn  = angDiff(rec.rotY, rec.faceY);
  if(ACTIVE.indexOf(rec) === -1) ACTIVE.push(rec);
  const L = ACTS[type].lines;
  el.say.textContent = (rec.name ? rec.name + ' : ' : '') + L[Math.floor(Math.random()*L.length)];
  el.say.hidden = false; sayTimer = 1.8;
}
function resetPose(rec){
  rec.up.rotation.x = 0; rec.up.rotation.z = 0;
  if(rec.wander) rec.up.position.y = 0.86;
  rec.head.rotation.x = 0;
  rec.armL.rotation.x = rec.baseArm; rec.armR.rotation.x = rec.baseArm;
  rec.armL.rotation.z = 0; rec.armR.rotation.z = 0;
  rec.g.rotation.y = rec.rotY;
}
function stepAct(rec, dt){
  const A = ACTS[rec.anim];
  rec.t += dt;
  let p = rec.t / A.dur; if(p > 1) p = 1;
  const s = Math.sin(p * Math.PI);
  const turn = rec.turn * Math.min(p * 4, 1) * (p > 0.8 ? (1 - p) / 0.2 : 1);
  rec.g.rotation.y = rec.rotY + turn;
  if(rec.anim === 'greet'){
    rec.up.rotation.x = s * 0.52;          // 허리 숙여 인사
    rec.head.rotation.x = s * 0.22;
  } else if(rec.anim === 'five'){
    rec.armR.rotation.x = rec.baseArm + s * (-2.5 - rec.baseArm);   // 손 번쩍
    rec.armR.rotation.z = -s * 0.35;
    rec.up.rotation.x = -s * 0.10;
  } else {
    rec.up.rotation.x = -s * 0.34;         // 움찔하며 뒤로
    rec.armL.rotation.x = rec.baseArm - s * 1.15;
    rec.armR.rotation.x = rec.baseArm - s * 1.15;
    rec.head.rotation.x = -s * 0.25;
    rec.g.rotation.y = rec.rotY + turn + Math.sin(p * Math.PI * 7) * 0.13 * s;
  }
  if(p >= 1){ resetPose(rec); rec.anim = null; return false; }
  return true;
}

addEventListener('keydown', function(e){
  if(!started || !nearPerson) return;
  if(e.code === 'Digit1') playAct(nearPerson, 'greet');
  else if(e.code === 'Digit2') playAct(nearPerson, 'five');
  else if(e.code === 'Digit3') playAct(nearPerson, 'surprise');
});
document.querySelectorAll('#act .opt').forEach(function(b){
  b.addEventListener('click', function(){ playAct(nearPerson, b.dataset.a); });
});

const clock=new THREE.Clock();
const fwd=new THREE.Vector3(), right=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  if(started){
    const run=keys['ShiftLeft']||keys['ShiftRight'];
    const spd=(run?5.6:3.0)*dt;
    let mx=0,mz=0;
    if(keys['KeyW']||keys['ArrowUp'])mz+=1;
    if(keys['KeyS']||keys['ArrowDown'])mz-=1;
    if(keys['KeyA']||keys['ArrowLeft'])mx-=1;
    if(keys['KeyD']||keys['ArrowRight'])mx+=1;
    if(mx||mz){
      const len=Math.hypot(mx,mz); mx/=len; mz/=len;
      fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));
      right.set(Math.cos(yaw),0,-Math.sin(yaw));
      const nx=pos.x+(fwd.x*mz+right.x*mx)*spd;
      const nz=pos.z+(fwd.z*mz+right.z*mx)*spd;
      const stuck=hits(pos.x,pos.z);
      if((stuck||!hits(nx,pos.z))&&!outOfBounds(nx,pos.z)) pos.x=nx;
      if((stuck||!hits(pos.x,nz))&&!outOfBounds(pos.x,nz)) pos.z=nz;
      bob+=dt*(run?13:8);
    } else bob+=dt*1.2;
  }
  camera.position.set(pos.x,EYE+Math.sin(bob)*0.035,pos.z);
  camera.rotation.set(pitch,yaw,0,'YXZ');

  for(let i=0;i<ROOMS.length;i++){ const r=ROOMS[i];
    if(pos.x>=r.x1&&pos.x<=r.x2&&pos.z>=r.z1&&pos.z<=r.z2){
      if(el.roomName.textContent!==r.n) el.roomName.textContent=r.n; break; } }

  // 돌아다니는 사람 갱신
  if(started){
    for(let i=WALKERS.length-1;i>=0;i--) stepWander(WALKERS[i], dt);
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnTimer = 0.8 + Math.random()*2.4;          // 일어나는 시점은 랜덤
      if(WALKERS.length < MAX_WALKERS && Math.random() < 0.65){
        const pool = [];
        for(let i=0;i<PEOPLE.length;i++){
          const P=PEOPLE[i];
          if(P.canWander && !P.wander && !P.anim) pool.push(P);
        }
        if(pool.length) startTrip(pool[Math.floor(Math.random()*pool.length)]);
      }
    }
  }
  // 사람 애니메이션
  for(let i=ACTIVE.length-1;i>=0;i--){
    if(!stepAct(ACTIVE[i], dt)) ACTIVE.splice(i,1);
  }
  // 머리 위 이름표 — 자리를 비운 사람만, 5m 이내, 벽 너머는 안 보임
  for(let i=0;i<FLOATS.length;i++){
    const f=FLOATS[i], r=f.rec, m=f.mesh;
    if(!r.wander){ m.visible=false; continue; }
    const gx=r.g.position.x, gz=r.g.position.z;
    const d=Math.hypot(pos.x-gx, pos.z-gz);
    if(d > 5.0 || blocked(pos.x,pos.z,gx,gz)){ m.visible=false; continue; }
    m.visible=true;
    m.position.set(gx, 2.02, gz);
    m.quaternion.copy(camera.quaternion);
  }
  // 가장 가까운 사람
  let np=null, nd=NEAR_DIST;
  for(let i=0;i<PEOPLE.length;i++){
    const P=PEOPLE[i], d=Math.hypot(pos.x-P.g.position.x, pos.z-P.g.position.z);
    if(d<nd){ nd=d; np=P; }
  }
  if(np!==nearPerson){
    nearPerson=np;
    el.actEl.hidden = !np || !started;
    if(np) el.actWho.textContent = np.name ? np.name : '가까이 있는 사람';
  }
  if(sayTimer>0){ sayTimer-=dt; if(sayTimer<=0) el.say.hidden=true; }

  let near=null,best=1e9;
  for(let i=0;i<SPOTS.length;i++){ const s=SPOTS[i],d=Math.hypot(pos.x-s.x,pos.z-s.z);
    if(d<s.r&&d<best){best=d;near=s;} }
  if(near!==activeSpot){
    activeSpot=near;
    if(near){ el.popTag.textContent=near.tag; el.popTitle.textContent=near.t; el.popBody.textContent=near.b;
      el.pop.classList.add('on');
      if(!near.seen){near.seen=true;discovered++;el.found.textContent=discovered;} }
    else el.pop.classList.remove('on');
  }
  renderer.render(scene,camera);
}
tick();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
