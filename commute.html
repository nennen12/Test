<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 출근길</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --ink:#14181B; --paper:#F1EFEA; --teal:#3E7B87; --amber:#E0A32E;
    --sans:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0c0e10;font-family:var(--sans)}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  #gate{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--paper);
    background:radial-gradient(120% 90% at 50% 25%,#2a3136 0%,#0f1214 72%);transition:opacity .45s ease}
  #gate.hidden{opacity:0;pointer-events:none}
  #gate .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--amber);margin-bottom:18px}
  #gate h1{font-size:clamp(32px,6.5vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
  #gate h1 em{font-style:normal;color:var(--teal)}
  #gate p{margin-top:14px;max-width:38ch;font-size:15px;line-height:1.7;color:#A6ADB2}
  #gate button{margin-top:30px;padding:14px 34px;border:0;border-radius:2px;cursor:pointer;
    background:var(--amber);color:#1A1408;font-family:var(--mono);font-size:13px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase}
  #gate .keys{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px 24px;max-width:620px;font-family:var(--mono);font-size:11px;color:#79828A;letter-spacing:.08em}
  #gate .keys b{color:var(--paper);font-weight:600}
  #vig{position:absolute;inset:0;z-index:8;pointer-events:none;
    background:radial-gradient(125% 105% at 50% 42%,transparent 60%,rgba(8,12,15,.32) 100%)}
  #crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    border-radius:50%;background:rgba(255,255,255,.75);z-index:10;pointer-events:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  #dbg{position:absolute;left:20px;bottom:20px;z-index:12;pointer-events:none;
    background:rgba(14,17,19,.72);backdrop-filter:blur(8px);padding:10px 14px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:#C8D2D7;line-height:1.9}
  #dbg b{color:var(--amber)} #dbg .fly{color:#4FD1C5}
  #act{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:14;
    background:rgba(241,239,234,.96);color:var(--ink);padding:10px 18px;font-size:14px;font-weight:600;
    box-shadow:0 12px 30px rgba(0,0,0,.3)}
  #act[hidden]{display:none}
  #fade{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;
    transition:opacity .7s ease;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:64px;font-weight:700;color:#4FD1C5;letter-spacing:.25em}
  #fade.on{opacity:1}
</style>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="crosshair" hidden></div>
  <div id="dbg" hidden></div>
  <div id="act" hidden></div>
  <div id="fade">4F</div>
  <div id="gate">
    <div class="eyebrow">나의 출근길</div>
    <h1>메모리Post FAB팀<br><em>MI 출근</em></h1>
    <p>통근버스에서 내렸습니다. 정문을 지나 식당에서 아침을 챙기고, C5 엘리베이터로 4층 사무실까지 가보세요.</p>
    <button id="go">출근 시작</button>
    <div class="keys">
      <span><b>W A S D</b> 이동</span><span><b>Shift</b> 뛰기</span>
      <span><b>Space</b> 사원증</span><span><b>F</b> 날기</span>
      <span><b>날 때 Space</b> 상승</span><span><b>날 때 Shift</b> 하강</span>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
/* ══════════════════════════════════════════════════════════════
   레이아웃 설정 — 거리는 전부 실제 미터, 화면에는 1/3로 그립니다
   ══════════════════════════════════════════════════════════════ */
const 축소배율 = 3;
const 길 = { 인도폭:6, 차도폭:8, 건너편인도폭:6, 총길이:1400, 가로수간격:60 };
const 정문동 = { 게이트수:4, 폭:16, 깊이:14, 높이:5, 동쪽확장:30 };
const 버스   = { 대수:14, 줄당대수:7, 거리:-170, 서쪽:12 };
const 정류장 = { 거리:-152, 서쪽길이:70, 동쪽길이:60 };   // 차도 양쪽에 하나씩
const 횡단보도 = { 거리:-34 };
const 건물 = [
  { 이름:'C5',    거리:80,  깊이:54,  서쪽:15, 폭:66,  층수:5, 유리:true,  문:'북쪽',   로비:true, 실내:true },
  { 이름:'식당',  거리:225, 깊이:120, 서쪽:24, 폭:153, 층수:2, 유리:false, 문:'남쪽', 로비:true, 실내:true },
  { 이름:'C3',    거리:485, 깊이:240, 서쪽:15, 폭:100, 층수:6, 유리:true,  문:'동쪽' },
  { 이름:'C1·C2', 거리:755, 깊이:480, 서쪽:15, 폭:100, 층수:6, 유리:true,  문:'동쪽' }
];
const 식당진입로 = { 거리:255, 길이:24 };
const 정원길 = { 폭:5 };   // C5 북쪽문 ↔ 식당 남쪽문 을 잇는 잔디 위 인도
const 건너편건물 = [
  { 이름:'SDI', 거리:60,  깊이:210, 동쪽:12, 폭:78, 층수:6 },
  { 이름:'',    거리:330, 깊이:210, 동쪽:12, 폭:78, 층수:5 },
  { 이름:'',    거리:600, 깊이:186, 동쪽:12, 폭:78, 층수:6 }
];
const 속도 = { 걷기:6, 뛰기:12, 비행:26, 상하:16 };
const 밝기 = { 노출:0.92, 햇빛:1.55, 하늘빛:0.5, 환경광:0.12 };
/* ══════════════════════════════════════════════════════════════ */
const S=축소배율, m=function(v){ return v/S; };
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=밝기.노출;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1400);
const EYE=1.62;
scene.add(camera);
// ═══ 절차적 텍스처 ════════════════════════════
function noiseTex(hex, amount, rep, grain){
  const N=128, cv=document.createElement('canvas'); cv.width=N; cv.height=N;
  const g=cv.getContext('2d');
  const r=(hex>>16)&255, gg=(hex>>8)&255, b=hex&255;
  const img=g.createImageData(N,N), D=img.data;
  for(let i=0;i<N*N;i++){
    const n=(Math.random()-0.5)*amount;
    const c=(Math.random()<(grain||0))? -amount*1.4 : 0;
    D[i*4]  =Math.max(0,Math.min(255,r+n+c));
    D[i*4+1]=Math.max(0,Math.min(255,gg+n+c));
    D[i*4+2]=Math.max(0,Math.min(255,b+n+c));
    D[i*4+3]=255;
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep);
  t.encoding=THREE.sRGBEncoding; t.anisotropy=4;
  return t;
}
function tiledTex(hex, line, rep, cols, rows){
  const N=128, cv=document.createElement('canvas'); cv.width=N; cv.height=N;
  const g=cv.getContext('2d');
  g.fillStyle='#'+hex.toString(16).padStart(6,'0'); g.fillRect(0,0,N,N);
  const img=g.getImageData(0,0,N,N), D=img.data;
  for(let i=0;i<N*N;i++){ const n=(Math.random()-0.5)*10;
    D[i*4]+=n; D[i*4+1]+=n; D[i*4+2]+=n; }
  g.putImageData(img,0,0);
  g.strokeStyle='#'+line.toString(16).padStart(6,'0'); g.lineWidth=2;
  for(let i=0;i<=cols;i++){ g.beginPath(); g.moveTo(i*N/cols,0); g.lineTo(i*N/cols,N); g.stroke(); }
  for(let j=0;j<=rows;j++){ g.beginPath(); g.moveTo(0,j*N/rows); g.lineTo(N,j*N/rows); g.stroke(); }
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep);
  t.encoding=THREE.sRGBEncoding; t.anisotropy=4;
  return t;
}
// ═══ 하늘 ═════════════════════════════════════
(function(){
  const cv=document.createElement('canvas'); cv.width=4; cv.height=512;
  const g=cv.getContext('2d'), grd=g.createLinearGradient(0,0,0,512);
  grd.addColorStop(0.00,'#2E5F98');
  grd.addColorStop(0.38,'#79A9CF');
  grd.addColorStop(0.68,'#B7D0E0');
  grd.addColorStop(0.88,'#E2D7C6');
  grd.addColorStop(1.00,'#D8C9B4');
  g.fillStyle=grd; g.fillRect(0,0,4,512);
  const t=new THREE.CanvasTexture(cv); t.encoding=THREE.sRGBEncoding;
  const sky=new THREE.Mesh(new THREE.SphereGeometry(900,26,18),
    new THREE.MeshBasicMaterial({map:t, side:THREE.BackSide, fog:false}));
  scene.add(sky);
})();
scene.fog=new THREE.Fog(0xBACFDE,140,460);
// ═══ 빛 ═══════════════════════════════════════
scene.add(new THREE.HemisphereLight(0xBFD6E8,0x5A6B48,밝기.하늘빛));
scene.add(new THREE.AmbientLight(0xDCE7EF,밝기.환경광));
const sun=new THREE.DirectionalLight(0xFFE7C2,밝기.햇빛);
sun.position.set(-60,50,34);
sun.castShadow=true;
sun.shadow.mapSize.set(3072,3072);
sun.shadow.camera.near=1; sun.shadow.camera.far=300;
sun.shadow.camera.left=-80; sun.shadow.camera.right=80;
sun.shadow.camera.top=80;   sun.shadow.camera.bottom=-80;
sun.shadow.bias=-0.0007; sun.shadow.normalBias=0.03;
scene.add(sun); scene.add(sun.target);
// ═══ 공용 ═════════════════════════════════════
const colliders=[];
const BOXG=new THREE.BoxGeometry(1,1,1);
const SPH=new THREE.SphereGeometry(1,12,9);
// 해 원반 + 원경 능선
(function(){
  const dir=new THREE.Vector3(-60,50,34).normalize();
  const disc=new THREE.Mesh(new THREE.CircleGeometry(24,24),
    new THREE.MeshBasicMaterial({color:0xFFF4D8,fog:false}));
  disc.position.copy(dir).multiplyScalar(830); disc.lookAt(0,0,0); scene.add(disc);
  const halo=new THREE.Mesh(new THREE.CircleGeometry(64,24),
    new THREE.MeshBasicMaterial({color:0xFFE9BE,transparent:true,opacity:0.2,fog:false}));
  halo.position.copy(dir).multiplyScalar(826); halo.lookAt(0,0,0); scene.add(halo);
  const hillM=new THREE.MeshBasicMaterial({color:0x7E9793});
  [[-300,-260,150,34],[-340,-60,190,40],[320,-200,170,36],[300,-420,210,44]].forEach(function(h){
    const o=new THREE.Mesh(SPH,hillM);
    o.position.set(h[0],-8,h[1]); o.scale.set(h[2],h[3],h[2]*0.8);
    scene.add(o);
  });
})();
function box(x,y,z,w,h,d,material,collide,sh){
  const o=new THREE.Mesh(BOXG,material);
  o.position.set(x,y,z); o.scale.set(w,h,d);
  if(sh===1||sh===3) o.castShadow=true;
  if(sh===2||sh===3) o.receiveShadow=true;
  scene.add(o);
  if(collide) colliders.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2});
  return o;
}
function ground(x1,z1,x2,z2,material,y){
  const o=new THREE.Mesh(new THREE.PlaneGeometry(Math.abs(x2-x1),Math.abs(z2-z1)),material);
  o.rotation.x=-Math.PI/2; o.position.set((x1+x2)/2,y||0,(z1+z2)/2);
  o.receiveShadow=true; scene.add(o); return o;
}
function label(text,w,h,color){
  const cv=document.createElement('canvas');
  const CW=1024, CH=Math.max(64,Math.min(1024,Math.round(CW*h/w)));   // 평면 종횡비와 일치
  cv.width=CW; cv.height=CH;
  const g=cv.getContext('2d');
  const fam='-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  let fs=Math.floor(CH*0.72);
  g.font='bold '+fs+'px '+fam;
  const tw=g.measureText(text).width;
  if(tw>CW*0.92){ fs=Math.floor(fs*CW*0.92/tw); g.font='bold '+fs+'px '+fam; }   // 길면 축소
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=color||'#22303A';
  g.fillText(text,CW/2,CH/2+fs*0.04);
  const t=new THREE.CanvasTexture(cv); t.encoding=THREE.sRGBEncoding;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:t,transparent:true,fog:false}));
}
function std(c,r,mt){ return new THREE.MeshStandardMaterial({color:c,roughness:r===undefined?0.92:r,metalness:mt||0}); }
const MAT={
  grass:  new THREE.MeshStandardMaterial({map:noiseTex(0x62834C,26,90,0.18), roughness:1}),
  walk:   new THREE.MeshStandardMaterial({map:tiledTex(0xB3B1A9,0xA5A39B,40,2,2), roughness:0.95}),
  road:   new THREE.MeshStandardMaterial({map:noiseTex(0x44474B,16,26,0.08), roughness:0.97}),
  lot:    new THREE.MeshStandardMaterial({map:noiseTex(0x4E5257,14,18,0.06), roughness:0.97}),
  floor:  new THREE.MeshStandardMaterial({map:tiledTex(0xADABA5,0x9B9992,10,3,3), roughness:0.6, metalness:0.1}),
  wood:   new THREE.MeshStandardMaterial({map:noiseTex(0xB59A72,16,22,0.06), roughness:0.9}),
  curb:   std(0xA6A39B,0.9),
  line:   std(0xE9E7E0,0.8),
  glass:  new THREE.MeshStandardMaterial({color:0x86AFC8, roughness:0.09, metalness:0.82}),
  glassLit:new THREE.MeshStandardMaterial({color:0xC8D8DE, roughness:0.2, metalness:0.4, emissive:0xE8D7A8, emissiveIntensity:0.5}),
  mull:   std(0x93A0A7,0.45,0.5),
  wall:   new THREE.MeshStandardMaterial({map:noiseTex(0xBEC1BC,10,7), roughness:0.92}),
  wall2:  std(0xACAFAA,0.9),
  roofTop:std(0x969B9A,0.95),
  dark:   std(0x272E32,0.7),
  metal:  std(0x8A9398,0.4,0.72),
  steel:  std(0xB2BABE,0.3,0.85),
  bus:    std(0xEDEEEF,0.5,0.18),
  busGl:  new THREE.MeshStandardMaterial({color:0x36434C,roughness:0.12,metalness:0.65}),
  bark:   std(0x63503E,0.95),
  leaf:   std(0x4C7A3A,0.95),
  leaf2:  std(0x5C8845,0.95),
  leaf3:  std(0x6E9450,0.95),
  lobby:  std(0xDBD9D3,0.85),
  teal:   std(0x2F6674,0.6),
  neon:   new THREE.MeshStandardMaterial({color:0x4FD1C5,roughness:0.4,emissive:0x1E8C82,emissiveIntensity:1.6}),
  door:   new THREE.MeshStandardMaterial({color:0xBFD9E6,roughness:0.05,metalness:0.4,transparent:true,opacity:0.32}),
  case:   new THREE.MeshStandardMaterial({color:0xCFE4EE,roughness:0.04,metalness:0.2,transparent:true,opacity:0.22})
};
const WALK_W=길.인도폭, ROAD_W=길.차도폭, FAR_W=길.건너편인도폭;
const Z_N=-m(길.총길이), Z_S=m(240);
// ═══ 지면 ═════════════════════════════════════
ground(-m(700),Z_N-60,m(600),Z_S+60,MAT.grass,-0.06);
ground(-WALK_W,Z_N,0,Z_S,MAT.walk,0.02);
ground(0,Z_N,ROAD_W,Z_S,MAT.road,0.0);
ground(ROAD_W,Z_N,ROAD_W+FAR_W,Z_S,MAT.walk,0.02);
[-WALK_W,0,ROAD_W,ROAD_W+FAR_W].forEach(function(x){
  box(x,0.11,(Z_S+Z_N)/2,0.32,0.22,Math.abs(Z_S-Z_N),MAT.curb,false,2);
});
for(let z=Z_S; z>Z_N; z-=6) box(ROAD_W/2,0.03,z,0.16,0.02,2.6,MAT.line,false,0);
(function(){
  const z=-m(횡단보도.거리);
  ground(-m(300),z-3.2,m(220),z+3.2,MAT.road,0.012);
  for(let k=-2.6;k<=2.6;k+=1.15) box(-WALK_W/2,0.05,z+k,WALK_W-0.7,0.02,0.62,MAT.line,false,0);
})();
// ═══ 인도 → 정원길 갈림길 ══════════════════════
(function(){
  const a=건물[0];
  const aE=-WALK_W-m(a.서쪽), aW=aE-m(a.폭), aX=(aW+aE)/2;
  const z=-m(a.거리)-m(a.깊이)-m(30);            // C5 북쪽문에서 30m 더 북쪽
  ground(aX, z-3, -WALK_W, z+3, MAT.walk, 0.021);
  for(let x=aX+2; x<-WALK_W; x+=2.2) box(x,0.026,z,0.06,0.01,6,MAT.curb,false,0);
})();
// ═══ 식당 실내 (4안) ══════════════════════════
// 자동문 → 정면 차단벽 → 우회전 → 복도 → 좌회전
//   좌측(서) 취식 홀: 남쪽 벽에 배식 코너 3곳 + 서쪽 끝 퇴식구
//   우측(동) 테이크아웃 룸 27m: 남·북 벽에 긴 쇼케이스, 통로와 개방
//   전실 서쪽: 출입 불가 주방
const TAKEOUT={spots:[],reader:null,heldMesh:null,held:null,paid:false};
(function(){
  const b=건물[1];
  const east=-WALK_W-m(b.서쪽), west=east-m(b.폭);
  const zS=-m(b.거리), zN=zS-m(b.깊이);
  const H=8, T=0.5, doorX=(west+east)/2;
  const wallZ=zS-5.5;
  const thrE=east-9, thrW=thrE-5;                 // 테이크아웃 9유닛(27m) · 통로 5유닛
  const vestW=doorX-4.5;                          // 전실 서쪽 = 주방 벽
  const roomN=zN+3.5;

  // ── 동선 벽 ──
  box((west+thrW)/2, H/2, wallZ, thrW-west, H, T, MAT.lobby, true, 3);    // 정면 차단벽
  box(thrE, H/2, (zS+wallZ)/2, T, H, zS-wallZ, MAT.lobby, true, 3);       // 복도 동쪽 끝
  box(vestW, H/2, (zS+wallZ)/2, T, H, zS-wallZ, MAT.lobby, true, 3);      // 주방 벽
  box((thrE+east)/2, H/2, roomN, east-thrE, H, T, MAT.lobby, true, 3);    // 테이크아웃 북벽
  // 주방 문(열리지 않음) + 표지
  box(vestW+0.3, 1.1, zS-2.8, 0.1, 2.2, 1.0, MAT.dark, false, 1);
  box(vestW+0.3, 2.62, zS-2.8, 0.06, 0.5, 2.6, MAT.dark, false, 0);
  const KS=label('주방 · 관계자 외 출입금지', 2.4, 0.42, '#F1EFEA');
  KS.position.set(vestW+0.37, 2.62, zS-2.8); KS.rotation.y=Math.PI/2; scene.add(KS);

  // ── 바닥 ──

function makeBuilding(west,z1,east,z2,floors,name,glass,faceEast,hollow){
  const w=Math.abs(east-west), d=Math.abs(z2-z1), h=floors*4;
  const cx=(west+east)/2, cz=(z1+z2)/2;
  if(hollow){                                             // hollow: 'S' 또는 'N' = 문이 있는 면
    const T=0.6, DW=6, WM=glass?MAT.glass:MAT.wall;
    const gz = hollow==='N' ? z2 : z1, fz = hollow==='N' ? z1 : z2;
    ground(west,z2,east,z1,MAT.floor,0.05);
    box(cx,h,cz,w,0.5,d,MAT.wall2,false,3);                 // 천장
    box(cx,h/2,fz,w,h,T,WM,true,3);                         // 문 없는 면
    box(west,h/2,cz,T,h,d,WM,true,3);                       // 서
    box(east,h/2,cz,T,h,d,WM,true,3);                       // 동

  const real=Math.round(-pos.z*S);
  el.dbg.innerHTML='정문 기준 <b>'+(real<0?'−'+(-real):real)+' m</b>'+
    (TAKEOUT.held?'<br>&#128717; '+TAKEOUT.held+(TAKEOUT.paid?' · 결제됨':' · 미결제'):'')+
    (flying?'<br><span class="fly">비행 중 · 고도 '+Math.round(height*S)+'m</span>':'');
  renderer.render(scene,camera);
}
tick();
addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
